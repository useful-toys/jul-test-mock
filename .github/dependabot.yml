# Docs: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
# Os PRs do Dependabot passam pelo mesmo CI (enforcer e matriz JDK 8/11/17/21).
# Nao cobertos: .mvn/wrapper (atualizacao manual com wrapper:wrapper) e, por nao ser
# documentado, .mvn/extensions.xml.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    ignore:
      # O JUnit 6 exige Java 17, mas a biblioteca gera bytecode Java 8 e o junit-jupiter-api
      # tem escopo compile (vai para o classpath de quem a usa). Fica na linha 5.x; o
      # enforceBytecodeVersion do enforcer barra a troca de qualquer modo.
      - dependency-name: "org.junit.jupiter:junit-jupiter-api"
        update-types: ["version-update:semver-major"]
    groups:
      # Os nomes sao groupId:artifactId; o * casa qualquer trecho.
      # Vale o primeiro grupo que casa: o que sobra cai em "dependencies".
      maven-plugins:
        patterns:
          - "*-plugin"
      dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
    groups:
      # Atualiza o SHA e o comentario "# vX.Y.Z" das actions fixadas por SHA.
      github-actions:
        patterns:
          - "*"
