# This workflow runs a Qodana static analysis scan on the codebase.
# It is triggered on pull requests, manual dispatch, and pushes to feature branches (not main).
# The results are used to identify code quality issues and potential bugs.

name: Qodana Scan

on:
  push:
    branches-ignore:
      - 'main'
    paths:
      - 'src/**'
      - 'pom.xml'
  pull_request:
  workflow_dispatch:

# contents: write is only needed when qodana-action pushes quick-fixes (input push-fixes),
# which is not enabled here (default: none).
permissions:
  contents: read
  pull-requests: write # summary comment and reactions on the pull request
  checks: write        # annotations published as a check run

jobs:
  qodana-scan:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}  # to check out the actual pull request commit, not the merge commit
          fetch-depth: 0
          # The action only runs 'git fetch' (anonymous works on a public repository; it falls back
          # to the webhook SHAs otherwise) and never pushes while push-fixes is none.
          persist-credentials: false

      - name: Qodana Scan
        uses: JetBrains/qodana-action@3e8d76ff0e0241618abd808682f426afe84bab3f # v2026.2.2
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_1586697939 }}
