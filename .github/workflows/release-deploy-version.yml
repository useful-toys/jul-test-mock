# This workflow validates, builds, and deploys the project to Maven Central.
# It is triggered on a push event for tags matching 'v*.*.*' (e.g., v1.2.3),
# or can be triggered manually.
#
# Comprehensive validation strategy:
# 1. Runs full test suite across all supported LTS JDK versions (8, 11, 17, 21)
# 2. Only proceeds to deployment if all tests pass
# 3. Builds, signs with GPG, and deploys to Maven Central
# 4. Creates GitHub Release with auto-generated notes
# 5. Uploads compiled JAR artifacts to release

name: Release and Deploy Version

on:
  push:
    tags:
      - 'v*.*.*' # Triggers on any tag starting with 'v'
  workflow_dispatch:

permissions:
  contents: write # to fetch code (actions/checkout) and push tags

jobs:
  # Build once with JDK 21 (the only JDK that runs Error Prone) and share the compiled classes
  build:
    name: Build (JDK 21)
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and run full test suite with JDK 21
        run: sh mvnw clean verify --batch-mode

      - name: Upload compiled artifacts for reuse
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiled-artifacts
          path: |
            target/classes/
            target/test-classes/
          retention-days: 1

  # Run the tests on the other LTS JDK versions, reusing the classes compiled by the build job
  test-compatibility:
    needs: build
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        # JDK 21 is omitted: the build job already ran the full test suite on it.
        java-version: [8, 11, 17]
      fail-fast: true # Stop immediately if any combination fails
    name: Test (JDK ${{ matrix.java-version }})

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Download compiled artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compiled-artifacts
          path: target/

      - name: Run tests with JDK ${{ matrix.java-version }}
        run: sh mvnw surefire:test --batch-mode

  # Deploy only after all tests pass
  build-release-deploy:
    needs: test-compatibility
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          gpg-private-key: ${{ secrets.GPG_SIGNING_KEY }}
          server-id: maven-central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD

      - name: Build and Deploy
        run: sh mvnw -ntp clean deploy -P release --batch-mode -DskipTests
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --generate-notes \
            --title "Version ${{ github.ref_name }}"
          echo "✓ GitHub Release ${{ github.ref_name }} created successfully"

      - name: Upload Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} \
            target/jul-test-mock-*.jar --clobber
          echo "✓ JAR artifact uploaded to release ${{ github.ref_name }}"
          echo "✓ Release ${{ github.ref_name }} is now live on Maven Central and GitHub"
