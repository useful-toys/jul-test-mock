# This workflow validates, builds, and deploys the project to Maven Central.
# It is triggered on a push event for tags matching 'v*.*.*' (e.g., v1.2.3),
# or can be triggered manually.
#
# Comprehensive validation strategy (same as the build/test workflow):
# 1. Builds once with JDK 21 (the only JDK that runs Error Prone) and runs the full
#    test suite, then shares the compiled classes as an artifact
# 2. Runs the tests on the other LTS JDK versions (8, 11, 17) against those classes,
#    without recompiling
# 3. Only proceeds to deployment if the build and all tests pass
# 4. Builds, signs with GPG, and deploys to Maven Central
# 5. Creates GitHub Release with auto-generated notes
# 6. Uploads compiled JAR artifacts to release

name: Release and Deploy Version

on:
  push:
    tags:
      - 'v*.*.*' # Triggers on any tag starting with 'v'
  workflow_dispatch:

# Least privilege: every job reads the repository only; the deploy job below raises it.
permissions:
  contents: read

jobs:
  # Build once with JDK 21 (the only JDK that runs Error Prone) and share the compiled classes
  build:
    name: Build (JDK 21)
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no step uses git credentials; keeps the token out of .git

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and run full test suite with JDK 21
        run: sh mvnw clean verify --batch-mode

      - name: Upload compiled artifacts for reuse
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiled-artifacts
          path: |
            target/classes/
            target/test-classes/
          retention-days: 1

  # Run the tests on the other LTS JDK versions, reusing the classes compiled by the build job
  test-compatibility:
    needs: build
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        # JDK 21 is omitted: the build job already ran the full test suite on it.
        java-version: [8, 11, 17]
      fail-fast: true # Stop immediately if any combination fails
    name: Test (JDK ${{ matrix.java-version }})

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no step uses git credentials; keeps the token out of .git

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Download compiled artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compiled-artifacts
          path: target/

      - name: Run tests with JDK ${{ matrix.java-version }}
        run: sh mvnw surefire:test --batch-mode

  # Deploy only after all tests pass
  build-release-deploy:
    needs: test-compatibility
    runs-on: ubuntu-26.04
    permissions:
      contents: write # gh release create / gh release upload

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no step uses git credentials; keeps the token out of .git

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          gpg-private-key: ${{ secrets.GPG_SIGNING_KEY }}
          server-id: maven-central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD

      - name: Check that the tag matches the pom version
        # Runs before anything is published. workflow_dispatch can start this workflow from a
        # branch, which would publish whatever version the pom has; a tag that disagrees with the
        # pom would publish an artifact under a version the release does not announce.
        # The ref comes from the runner environment (GITHUB_REF_TYPE, GITHUB_REF_NAME), never
        # interpolated into the script, so a crafted tag name cannot inject commands.
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::A release can only run from a tag, but the current ref is the ${GITHUB_REF_TYPE} '${GITHUB_REF_NAME}'. Start the workflow from a vX.Y.Z tag."
            exit 1
          fi
          POM_VERSION=$(sh mvnw -q -DforceStdout help:evaluate -Dexpression=project.version --batch-mode) || {
            echo "::error::Could not read the project version from pom.xml."
            exit 1
          }
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "${TAG_VERSION}" != "${POM_VERSION}" ]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' (version ${TAG_VERSION}) does not match the pom.xml version '${POM_VERSION}'. Fix the pom version or tag the right commit."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches the pom.xml version ${POM_VERSION}"

      - name: Build and Deploy
        run: sh mvnw -ntp clean deploy -P release --batch-mode -DskipTests -Dmaven.build.cache.enabled=false
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --generate-notes \
            --title "Version ${{ github.ref_name }}"
          echo "✓ GitHub Release ${{ github.ref_name }} created successfully"

      - name: Upload Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} \
            target/jul-test-mock-*.jar --clobber
          echo "✓ JAR artifact uploaded to release ${{ github.ref_name }}"
          echo "✓ Release ${{ github.ref_name }} is now live on Maven Central and GitHub"
