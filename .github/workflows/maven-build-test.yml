# This workflow builds, tests, and analyzes the project.
# It runs on pushes and pull requests to the main branch,
# and on pushes to feature branches (only for code changes).
# Tests are executed against LTS JDK versions: 8, 11, 17, 21.
#
# Strategy:
# 1. Build once with JDK 21 (generates JAR and runs the full test suite)
# 2. Run tests on the other LTS JDK versions (8, 11, 17) using the compiled artifact
# 3. Run Checkstyle, PMD and SpotBugs in parallel on the compiled artifact, then
#    aggregate their SARIF reports and the build's coverage into one summary

name: Maven Build, Test and Analyze

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  statuses: write
  security-events: write
  actions: read
  checks: write

jobs:
  # Job 0: Check if code changes occurred to avoid unnecessary builds
  changes:
    name: Check for Code Changes
    runs-on: ubuntu-26.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for code changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - '**'
              - '!*.md'
              - '!**/*.md'

  # Job 1: Build artifact with JDK 21
  build:
    name: Build (JDK 21)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Cache warm-up: setup-java saves ~/.m2/repository once per pom.xml hash, at the end of
      # this job. Resolving the static-analysis plugins here lets the analysis jobs, which
      # start after this one, restore a complete cache.
      - name: Populate Maven cache
        run: sh mvnw dependency:resolve-plugins dependency:go-offline -P static-analysis,javadoc-validation --batch-mode -ntp

      - name: Build and run full test suite with JDK 21
        run: sh mvnw clean verify --batch-mode

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2
        with:
          file: ./target/site/jacoco/jacoco.xml

      - name: Upload coverage to Codacy
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: ./target/site/jacoco/jacoco.xml

      - name: Upload compiled artifacts for reuse
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiled-artifacts
          path: |
            target/classes/
            target/test-classes/
          retention-days: 1

      - name: Upload coverage report for the static analysis summary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: target/site/jacoco/jacoco.csv
          retention-days: 1

  # Job 2: Run tests on the other LTS JDK versions
  test-compatibility:
    runs-on: ubuntu-26.04
    needs: [build, changes]
    if: needs.changes.outputs.code == 'true'
    strategy:
      matrix:
        # JDK 21 is omitted: the build job already ran the full test suite on it.
        java-version: [8, 11, 17]
      fail-fast: false
    name: Test (JDK ${{ matrix.java-version }})

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Download compiled artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compiled-artifacts
          path: target/

      - name: Run tests with JDK ${{ matrix.java-version }}
        run: sh mvnw surefire:test --batch-mode -Denforcer.skip=true

  # Job: Static analysis (informative, does not gate the pipeline)
  # Two jobs after the build, in parallel with the compatibility tests: Checkstyle and PMD
  # together, SpotBugs alone. The analyzers' Maven goals run directly on the classes compiled
  # by the build job (no recompilation, no tests); each job publishes its SARIF reports to
  # Code Scanning and as an artifact for the report job.
  static-analysis:
    name: Static Analysis (${{ matrix.group }})
    needs: [build, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        include:
          - group: Checkstyle + PMD
            id: checkstyle-pmd
            goals: checkstyle:checkstyle pmd:pmd
            checkstyle: true
            pmd: true
          - group: SpotBugs
            id: spotbugs
            goals: spotbugs:spotbugs
            spotbugs: true
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # PMD uses the classes for type resolution and SpotBugs analyzes them.
      - name: Download compiled artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compiled-artifacts
          path: target/

      - name: Run ${{ matrix.group }}
        run: sh mvnw ${{ matrix.goals }} -P static-analysis --batch-mode -ntp

      - name: Make SARIF paths repository-relative
        run: |
          for f in target/checkstyle-result.sarif target/pmd.sarif.json target/spotbugsSarif.json; do
            if [ -f "$f" ]; then python3 .github/scripts/sarif_report.py normalize "$f"; fi
          done

      - name: Upload SARIF to Code Scanning (Checkstyle)
        # Fork PRs get a read-only token, so skip the steps that need write access.
        if: matrix.checkstyle && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: target/checkstyle-result.sarif
          category: checkstyle

      - name: Upload SARIF to Code Scanning (PMD)
        if: matrix.pmd && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: target/pmd.sarif.json
          category: pmd

      - name: Upload SARIF to Code Scanning (SpotBugs)
        if: matrix.spotbugs && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: target/spotbugsSarif.json
          category: spotbugs

      - name: Upload SARIF for the report job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-${{ matrix.id }}
          path: |
            target/*.sarif
            target/pmd.sarif.json
            target/spotbugsSarif.json
          retention-days: 1

  # Job: Aggregates the analyzers' SARIF reports and the build's coverage into the job
  # summary, a sticky PR comment and one artifact. Runs even if an analyzer failed, with
  # whatever reports arrived.
  static-analysis-report:
    name: Static Analysis Report
    needs: [changes, build, static-analysis]
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download SARIF reports
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sarif-*
          merge-multiple: true
          path: target/

      - name: Download coverage report
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: target/

      - name: Publish summary
        run: |
          reports=()
          for f in target/checkstyle-result.sarif target/pmd.sarif.json target/spotbugsSarif.json; do
            if [ -f "$f" ]; then reports+=("$f"); fi
          done
          {
            if [ ${#reports[@]} -gt 0 ]; then
              python3 .github/scripts/sarif_report.py markdown "${reports[@]}"
            fi
            if [ -f target/jacoco.csv ]; then
              python3 .github/scripts/sarif_report.py coverage target/jacoco.csv
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY" > target/sarif-summary.md

      - name: Comment summary on pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: static-analysis
          path: target/sarif-summary.md

      - name: Upload SARIF reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-reports
          path: |
            target/*.sarif
            target/pmd.sarif.json
            target/spotbugsSarif.json
          retention-days: 7

  # Job 3: Final status check to simplify branch protection rules
  status-gateway:
    name: Status Gateway
    needs: [changes, build, test-compatibility]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.changes.result }}" != "success" ]] || \
             [[ "${{ needs.changes.outputs.code }}" == "true" && ("${{ needs.build.result }}" != "success" || "${{ needs.test-compatibility.result }}" != "success") ]]; then
            echo "Required jobs failed or were cancelled"
            exit 1
          fi
          echo "All checks passed or correctly skipped"
