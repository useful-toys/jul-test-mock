# This workflow builds, tests, and analyzes the project.
# It runs on pushes and pull requests to the main branch,
# and on pushes to feature branches (only for code changes).
# Tests are executed against LTS JDK versions: 8, 11, 17, 21.
#
# Strategy:
# 1. Build once with JDK 21 (generates JAR)
# 2. Run tests on all LTS JDK versions using the compiled artifact

name: Maven Build, Test and Analyze

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  statuses: write
  security-events: write
  actions: read
  checks: write

jobs:
  # Job 0: Check if code changes occurred to avoid unnecessary builds
  changes:
    name: Check for Code Changes
    runs-on: ubuntu-26.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for code changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - '**'
              - '!*.md'
              - '!**/*.md'

  # Job 1: Build artifact with JDK 21
  build:
    name: Build (JDK 21)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and run full test suite with JDK 21
        run: sh mvnw clean verify --batch-mode

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2
        with:
          file: ./target/site/jacoco/jacoco.xml

      - name: Upload coverage to Codacy
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: ./target/site/jacoco/jacoco.xml

      - name: Upload compiled artifacts for reuse
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiled-artifacts
          path: |
            target/classes/
            target/test-classes/
          retention-days: 1

  # Job 2: Run tests on all LTS JDK versions
  test-compatibility:
    runs-on: ubuntu-26.04
    needs: [build, changes]
    if: needs.changes.outputs.code == 'true'
    strategy:
      matrix:
        java-version: [8, 11, 17, 21]
      fail-fast: false
    name: Test (JDK ${{ matrix.java-version }})

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Download compiled artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compiled-artifacts
          path: target/

      - name: Run tests with JDK ${{ matrix.java-version }}
        run: sh mvnw surefire:test --batch-mode -Denforcer.skip=true

  # Job: Static analysis (informative, does not gate the pipeline)
  # Runs the 'static-analysis' Maven profile and publishes the SARIF reports as
  # Code Scanning alerts, job summary, PR comment and artifact.
  static-analysis:
    name: Static Analysis (SARIF)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run static analyzers
        run: sh mvnw clean verify -P static-analysis --batch-mode

      - name: Make SARIF paths repository-relative
        run: python3 .github/scripts/sarif_report.py normalize target/checkstyle-result.sarif

      - name: Publish summary
        run: python3 .github/scripts/sarif_report.py markdown target/checkstyle-result.sarif | tee -a "$GITHUB_STEP_SUMMARY" > target/sarif-summary.md

      - name: Upload SARIF to Code Scanning (Checkstyle)
        # Fork PRs get a read-only token, so skip the steps that need write access.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: target/checkstyle-result.sarif
          category: checkstyle

      - name: Comment summary on pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: static-analysis
          path: target/sarif-summary.md

      - name: Upload SARIF reports
        uses: actions/upload-artifact@v4
        with:
          name: sarif-reports
          path: target/*.sarif
          retention-days: 7

  # Job 3: Final status check to simplify branch protection rules
  status-gateway:
    name: Status Gateway
    needs: [changes, build, test-compatibility]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.changes.result }}" != "success" ]] || \
             [[ "${{ needs.changes.outputs.code }}" == "true" && ("${{ needs.build.result }}" != "success" || "${{ needs.test-compatibility.result }}" != "success") ]]; then
            echo "Required jobs failed or were cancelled"
            exit 1
          fi
          echo "All checks passed or correctly skipped"
