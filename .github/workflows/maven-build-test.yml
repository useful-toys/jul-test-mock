# This workflow builds, tests, and analyzes the project.
# It runs on pushes and pull requests to the main branch,
# and on pushes to feature branches (only for code changes).
# Tests are executed against LTS JDK versions: 8, 11, 17, 21.
#
# Strategy:
# 1. Build once with JDK 21 (generates JAR and runs the full test suite)
# 2. Run tests on the other LTS JDK versions (8, 11, 17) using the compiled artifact
# 3. Run Checkstyle, PMD and SpotBugs in parallel on the compiled artifact, then
#    aggregate their SARIF reports and the build's coverage into one summary

name: Maven Build, Test and Analyze

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege: jobs read the repository only; each job below declares anything extra.
# A job-level permissions block replaces this one, so it must repeat contents: read.
permissions:
  contents: read

jobs:
  # Job 0: Check if code changes occurred to avoid unnecessary builds
  changes:
    name: Check for Code Changes
    runs-on: ubuntu-26.04
    permissions:
      contents: read       # actions/checkout and the git diff on push events
      pull-requests: read  # dorny/paths-filter lists the PR files through the API
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # keeps the token out of .git

      - name: Check for code changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - '**'
              - '!*.md'
              - '!**/*.md'

  # Job 1: Build artifact with JDK 21
  build:
    name: Build (JDK 21)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    # Codecov, Coveralls and Codacy authenticate with their own tokens (Coveralls also works
    # on fork PRs, where GITHUB_TOKEN is read-only), so no extra GITHUB_TOKEN scope is needed.
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false # keeps the token out of .git, away from Maven plugins

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Cache warm-up: setup-java saves ~/.m2/repository once per pom.xml hash, at the end of
      # this job. Resolving the static-analysis plugins here lets the analysis jobs, which
      # start after this one, restore a complete cache.
      - name: Populate Maven cache
        run: sh mvnw dependency:resolve-plugins dependency:go-offline -P static-analysis,javadoc-validation --batch-mode -ntp

      - name: Build and run full test suite with JDK 21
        run: sh mvnw clean verify --batch-mode

      # Dependabot runs get neither the repository secrets nor a writable GITHUB_TOKEN, so the
      # uploads that authenticate with a repository secret are skipped for it.
      - name: Upload coverage to Codecov
        if: github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2
        with:
          file: ./target/site/jacoco/jacoco.xml

      - name: Upload coverage to Codacy
        if: github.actor != 'dependabot[bot]'
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: ./target/site/jacoco/jacoco.xml

      - name: Upload compiled artifacts for reuse
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiled-artifacts
          path: |
            target/classes/
            target/test-classes/
          retention-days: 1

      - name: Upload coverage report for the static analysis summary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: target/site/jacoco/jacoco.csv
          retention-days: 1

  # Job 2: Run tests on the other LTS JDK versions
  test-compatibility:
    runs-on: ubuntu-26.04
    needs: [build, changes]
    if: needs.changes.outputs.code == 'true'
    strategy:
      matrix:
        # JDK 21 is omitted: the build job already ran the full test suite on it.
        java-version: [8, 11, 17]
      fail-fast: false
    name: Test (JDK ${{ matrix.java-version }})
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # keeps the token out of .git, away from Maven plugins

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Download compiled artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compiled-artifacts
          path: target/

      - name: Run tests with JDK ${{ matrix.java-version }}
        run: sh mvnw surefire:test --batch-mode

  # Job: Static analysis (informative, does not gate the pipeline)
  # Runs after the build, in parallel with the compatibility tests: the analyzers' Maven goals
  # run directly on the classes compiled by the build job (no recompilation, no tests). The
  # SARIF reports go to Code Scanning, the job summary, a PR comment and an artifact.
  static-analysis:
    name: Static Analysis (SARIF)
    needs: [build, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read         # actions/checkout
      security-events: write # github/codeql-action/upload-sarif
      pull-requests: write   # sticky pull request comment
      actions: read          # upload-sarif reads the workflow run (required on private repositories)

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # keeps the token out of .git, away from Maven plugins

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # PMD uses the classes for type resolution and SpotBugs analyzes them.
      - name: Download compiled artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compiled-artifacts
          path: target/

      - name: Download coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: target/

      # dependency:analyze-only has no report file; its log is kept for the summary.
      - name: Run static analyzers
        run: |
          set -o pipefail
          sh mvnw checkstyle:checkstyle pmd:pmd spotbugs:spotbugs dependency:analyze-only -P static-analysis --batch-mode -ntp | tee target/static-analysis.log

      - name: Make SARIF paths repository-relative
        run: python3 .github/scripts/sarif_report.py normalize target/checkstyle-result.sarif target/pmd.sarif.json target/spotbugsSarif.json

      - name: Publish summary
        run: |
          {
            python3 .github/scripts/sarif_report.py markdown target/checkstyle-result.sarif target/pmd.sarif.json target/spotbugsSarif.json
            echo "## Dependency analysis"
            echo
            issues=$(sed -n '/--- dependency:.*:analyze-only/,/--- \|BUILD/p' target/static-analysis.log | grep '^\[WARNING\]' | sed 's/^\[WARNING\] *//' || true)
            if [ -z "$issues" ]; then
              echo "No dependency problems found."
            else
              printf '```\n%s\n```\n' "$issues"
            fi
            echo
            python3 .github/scripts/sarif_report.py coverage target/jacoco.csv
          } | tee -a "$GITHUB_STEP_SUMMARY" > target/sarif-summary.md

      - name: Upload SARIF to Code Scanning (Checkstyle)
        # Fork PRs get a read-only token, so skip the steps that need write access.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: target/checkstyle-result.sarif
          category: checkstyle

      - name: Upload SARIF to Code Scanning (PMD)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: target/pmd.sarif.json
          category: pmd

      - name: Upload SARIF to Code Scanning (SpotBugs)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: target/spotbugsSarif.json
          category: spotbugs

      - name: Comment summary on pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: static-analysis
          path: target/sarif-summary.md

      - name: Upload SARIF reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-reports
          path: |
            target/*.sarif
            target/pmd.sarif.json
            target/spotbugsSarif.json
          retention-days: 7

  # Job 3: Final status check to simplify branch protection rules
  status-gateway:
    name: Status Gateway
    needs: [changes, build, test-compatibility]
    if: always()
    runs-on: ubuntu-26.04
    permissions: {} # only inspects the results of the needed jobs; uses no token
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.changes.result }}" != "success" ]] || \
             [[ "${{ needs.changes.outputs.code }}" == "true" && ("${{ needs.build.result }}" != "success" || "${{ needs.test-compatibility.result }}" != "success") ]]; then
            echo "Required jobs failed or were cancelled"
            exit 1
          fi
          echo "All checks passed or correctly skipped"
